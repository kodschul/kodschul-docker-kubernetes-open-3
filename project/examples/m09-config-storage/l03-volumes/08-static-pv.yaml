# Statisches PersistentVolume, von Hand angelegt (Lab 9.3), und ein Claim, der genau dieses PV bindet
apiVersion: v1
kind: PersistentVolume             # gilt für den ganzen Cluster, ohne Namespace
metadata:
  name: hello-pv
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain   # Daten bleiben, wenn der Claim gelöscht wird
  hostPath:
    path: /tmp/hello-pv                   # Ordner auf dem Node docker-desktop
    type: DirectoryOrCreate               # Ordner anlegen, falls er fehlt
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hello-pv-claim
  labels:
    app: hello-frontend
spec:
  storageClassName: ""             # leer = keine StorageClass; sonst trägt Kubernetes die Default-StorageClass ein
  volumeName: hello-pv             # genau dieses PV binden
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
