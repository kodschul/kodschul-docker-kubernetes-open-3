# Secret der Hello-App (Lab 9.2) als Manifest – nur für die Wiederherstellung des Übungsstands.
# uebung-2026 ist ein Übungswert. Echte Passwörter nie in eine Datei schreiben, die in Git landet;
# im Alltag entsteht das Secret per Befehl:
#   kubectl create secret generic hello-secret --from-literal=admin-password=uebung-2026
apiVersion: v1
kind: Secret
metadata:
  name: hello-secret
type: Opaque
stringData:                       # Klartext beim Anlegen; gespeichert wird Base64 unter data
  admin-password: uebung-2026     # Übungswert
