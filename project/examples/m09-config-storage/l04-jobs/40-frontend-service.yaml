# Service "frontend" (Lab 7.3): von außen über http://localhost:30080 erreichbar
# Selector nur app: hello-frontend, damit jede Version (v1, v2) dahinter stehen kann (Lab 8.3)
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: hello-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080                  # Bereich 30000-32767
