# Lab 9.3 – Starter: statisches PersistentVolume hello-pv und Claim hello-pv-claim
# Kopieren nach playground/k8s/08-static-pv.yaml, TODO ergänzen, dann:
#   kubectl apply -f playground/k8s/08-static-pv.yaml
apiVersion: v1
kind: PersistentVolume             # gilt für den ganzen Cluster, ohne Namespace
metadata:
  name: hello-pv
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain   # Daten bleiben, wenn der Claim gelöscht wird
  hostPath:
    path: /tmp/hello-pv                   # Ordner auf dem Node docker-desktop
    type: DirectoryOrCreate               # Ordner anlegen, falls er fehlt
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hello-pv-claim
  labels:
    app: hello-frontend
spec:
  # TODO: storageClassName so setzen, dass keine StorageClass greift (sonst greift die Default-StorageClass)
  volumeName: hello-pv             # genau dieses PV binden
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
